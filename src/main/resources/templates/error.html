<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Something Went Wrong', 'app')}"></head>
<body class="standalone-error-body ef-error">
<main class="standalone-error-card">
    <div class="error-symbol"><i class="bi bi-exclamation-triangle"></i></div>
    <span class="section-kicker" th:text="${status != null ? status + ' ERROR' : 'OCCAVIE'}">OCCAVIE</span>
    <h1>Something went wrong.</h1>
    <p>We could not load this page. Please return to Occavie and try again.</p>
    <div class="error-actions"><a class="primary-button" th:href="@{/}" href="/">Back to Occavie</a></div>
</main>

</body>
</html>
