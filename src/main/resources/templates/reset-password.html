<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reset password', 'public')}"></head>
<body class="ov-page">
<a class="skip-link" href="#main-content">Skip to content</a>
<div th:replace="~{fragments :: siteNav('auth')}"></div>
<main class="ov-container ov-reset" id="main-content">
    <section class="ov-reset-card">
        <h1>Choose a new password</h1>
        <div class="ov-alert is-error" th:if="${resetError != null}" th:text="${resetError}" role="alert">Error</div>
        <form th:if="${tokenValid}" th:action="@{/reset-password}" method="post" class="ov-auth-panel-form">
            <input type="hidden" name="token" th:value="${token}">
            <label for="newPassword">New password</label>
            <div class="ov-auth-input"><i class="bi bi-lock" aria-hidden="true"></i><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required></div>
            <p class="ov-password-help">8+ characters with uppercase, lowercase, a number and a symbol.</p>
            <label for="confirmPassword">Confirm new password</label>
            <div class="ov-auth-input"><i class="bi bi-lock" aria-hidden="true"></i><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
            <button class="ov-gold-button ov-auth-submit" type="submit">Update password</button>
        </form>
        <div th:unless="${tokenValid}" class="ov-empty">
            <div class="empty-icon"><i class="bi bi-link-45deg"></i></div>
            <h3>This reset link is invalid or has expired</h3>
            <p>Reset links work once and expire after 30 minutes. Request a new one from the login page.</p>
            <a class="primary-button" th:href="@{/login(forgot=1)}">Request a new link</a>
        </div>
    </section>
</main>
<div th:replace="~{fragments :: siteFooter}"></div>
<script th:src="@{/js/site.js(v='2026.11.5')}" src="/js/site.js"></script>
</body>
</html>
